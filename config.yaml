# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# touch: trigger Envio deployment (2026-08-28 #1)
name: uniswap-v4-indexer
contracts:
  - name: PoolManager
    events:
      - event: Approval(address indexed owner, address indexed spender, uint256 indexed id, uint256 amount)
      - event: Donate(bytes32 indexed id, address indexed sender, uint256 amount0, uint256 amount1)
      - event: Initialize(bytes32 indexed id, address indexed currency0, address indexed currency1, uint24 fee, int24 tickSpacing, address hooks, uint160 sqrtPriceX96, int24 tick)
      - event: ModifyLiquidity(bytes32 indexed id, address indexed sender, int24 tickLower, int24 tickUpper, int256 liquidityDelta, bytes32 salt)
        field_selection: # Additional fields available to index to augment data
          transaction_fields:
            - "hash"
            - "from"
      - event: OperatorSet(address indexed owner, address indexed operator, bool approved)
      - event: OwnershipTransferred(address indexed user, address indexed newOwner)
      - event: ProtocolFeeControllerUpdated(address indexed protocolFeeController)
      - event: ProtocolFeeUpdated(bytes32 indexed id, uint24 protocolFee)
      - event: Swap(bytes32 indexed id, address indexed sender, int128 amount0, int128 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick, uint24 fee)
        field_selection: # Additional fields available to index to augment data
          transaction_fields:
            - "hash"
            - "from"
      - event: Transfer(address caller, address indexed from, address indexed to, uint256 indexed id, uint256 amount)
  - name: PositionManager
    events:
      - event: Subscription(uint256 indexed tokenId, address indexed subscriber)
        field_selection:
          transaction_fields:
            - "hash"
            - "from"
      - event: Transfer(address indexed from, address indexed to, uint256 indexed id)
        field_selection:
          transaction_fields:
            - "hash"
            - "from"
      - event: Unsubscription(uint256 indexed tokenId, address indexed subscriber)
        field_selection:
          transaction_fields:
            - "hash"
            - "from"
# This fork exists to serve NFTX's Uniswap v4 pool data, so it indexes exactly the
# five chains NFTX v4 is deployed on. Every chain's `start_block` is the NFTX
# protocol deployment on that chain — not the PoolManager deployment and not
# genesis — because only pools that NFTX initialises matter here, and all of them
# are created after the protocol lands. The blocks are copied verbatim from the
# NFTX indexer (Flayer/Subgraph/config.yaml) so the two stay aligned.
#
# Events from pools initialised before the start block are skipped by the handlers
# (`Pool` entity absent -> early return), not mis-indexed. One consequence is that
# each chain's stablecoin/native pricing anchor pool predates the start block, so
# `Bundle.ethPriceUSD` stays 0 and every USD-denominated field with it. That is
# accepted: NFTX reads only the ETH-denominated fields (sqrtPrice, volumeToken0/1,
# totalValueLockedToken0/1).
chains:
  # Ethereum mainnet. The v3 protocol generation (nftx.v3 salt namespace) was
  # deployed across blocks 25638238-25638272; PoolManager itself landed at
  # 21688329, ~4M blocks earlier.
  - id: 1
    start_block: 25638238
    contracts:
      - name: PositionManager
        address:
          - 0xbD216513d74C8cf14cf4747E6AaA6420FF64ee9e
      - name: PoolManager
        address:
          - "0x000000000004444c5dc75cB358380D2e3dE08A90"
  # Ethereum Sepolia. The protocol deployment spans blocks 11465794-11465822.
  # Sepolia has no v4 pool whose price tracks the real ETH market, so its
  # `stablecoinWrappedNativePoolId` is left unset in src/utils/chains.ts.
  - id: 11155111
    start_block: 11465794
    contracts:
      - name: PositionManager
        address:
          - 0x429ba70129df741B2Ca2a85BC3A2a3328e5c09b4
      - name: PoolManager
        address:
          - 0xE03A1074c86CFeDd5C142C4F04F1a1536e203543
  # Robinhood Chain — Arbitrum Nitro (Orbit), native currency ETH. The deployment
  # spans blocks 35354594-35354959; pinned 100 below the first receipt because
  # HyperSync filters by address server-side, so an over-wide range is nearly free.
  - id: 4663
    start_block: 35354494
    contracts:
      - name: PositionManager
        address:
          - 0x58daec3116aae6d93017baaea7749052e8a04fa7
      - name: PoolManager
        address:
          - 0x8366a39cc670b4001a1121b8f6a443a643e40951
  # Ink — OP-stack L2 (Kraken). No v4 Ink subgraph exists on The Graph, so this is
  # the only pool-data source for the chain. Deployment spans 54329001-54329039;
  # PoolManager landed at 4580556, ~50M blocks earlier.
  - id: 57073
    start_block: 54328901
    contracts:
      - name: PositionManager
        address:
          - 0x1b35d13a2e2528f192637f14b05f0dc0e7deb566
      - name: PoolManager
        address:
          - 0x360e68faccca8ca495c1b759fd9eee466db9fb32
  # Arbitrum One — Nitro, native currency ETH. Deployment spans
  # 498892378-498892454; PoolManager landed at 297842872, ~200M blocks earlier.
  - id: 42161
    start_block: 498892278
    contracts:
      - name: PositionManager
        address:
          - 0xd88f38f930b7952f2db2432cb002e7abbf3dd869
      - name: PoolManager
        address:
          - 0x360e68faccca8ca495c1b759fd9eee466db9fb32
