# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# touch: trigger Envio deployment (2026-08-28 #1)
name: uniswap-v4-indexer
# Every subscribed event is only a trigger: the handler fetches the transaction
# receipt and replays the PoolManager logs in it. The hash is all it needs.
field_selection:
  transaction_fields:
    - hash
# Nothing here is a Uniswap contract. The PoolManager is a chain-wide singleton
# whose Swap/ModifyLiquidity logs do not carry the hook and whose Initialize log
# carries it only in the data, so subscribing to it means ingesting every pool on
# the chain to keep a handful. Our hooks, by contrast, emit a state event after
# every initialize/swap/add/remove on every pool they serve, from a fixed
# address per chain. Those events (plus the two creation events) are the whole
# subscription; the PoolManager activity behind them is read from the receipt.
#
# Consequences: no pool-id allowlist, no chain-wide log stream, and an unrelated
# transaction never reaches a handler or costs an RPC call. Adding a hook
# deployment means adding its address to the chain below AND to
# src/utils/nftxHooks.ts (the receipt replay admits only pools on a listed hook).
contracts:
  - name: NFTXLocker
    events:
      # Canonical pool creation. Fires after the seed deposit in the same
      # transaction as PoolManager.Initialize, so the replay sees creation first.
      - event: CollectionInitialized(address indexed _collection, bytes _poolKey, uint256[] _tokenIds, uint256 _sqrtPriceX96, address _sender)
  - name: NFTXV4Hook
    events:
      # Emitted after initialize, swap, add and remove on every canonical pool.
      - event: PoolStateUpdated(address indexed _collection, uint160 _sqrtPriceX96, int24 _tick, uint24 _protocolFee, uint24 _swapFee, uint128 _liquidity)
  - name: NFTXFlexHook
    events:
      # Emitted from beforeInitialize; the pool's first deposit may be a later tx.
      - event: FlexPoolInitialized(bytes32 indexed _poolId, address indexed _collectionToken, address indexed _pairToken, (address,address,uint24,int24,address) _key, uint160 _sqrtPriceX96)
      # Emitted after swap, add and remove on every flex pool.
      - event: FlexPoolStateUpdated(bytes32 indexed _poolId, uint160 _sqrtPriceX96, int24 _tick, uint24 _protocolFee, uint24 _swapFee, uint128 _liquidity)
# This fork exists to serve NFTX's Uniswap v4 pool data, so it indexes exactly the
# six chains NFTX v4 is deployed on. Every chain's `start_block` is the NFTX
# protocol deployment on that chain — not the PoolManager deployment and not
# genesis — because only pools that NFTX initialises matter here, and all of them
# are created after the protocol lands. The blocks are copied verbatim from the
# NFTX indexer (Flayer/Subgraph/config.yaml) so the two stay aligned.
#
# The hook and Locker addresses are CREATE3 deployments and identical on every
# chain. The PoolManager address per chain lives in src/utils/chains.ts; it is
# what the receipt replay matches logs against.
chains:
  # Ethereum mainnet. The v3 protocol generation (nftx.v3 salt namespace) was
  # deployed across blocks 25638238-25638272; PoolManager itself landed at
  # 21688329, ~4M blocks earlier.
  - id: 1
    start_block: 25638238
    contracts:
      - name: NFTXLocker
        address:
          - 0xb4C5b5235b98114E9DC227b54e088C11680b2385
      - name: NFTXV4Hook
        address:
          - 0xaa49ADaDD33c5E953b645567AFb10CBbba63afC4
      # The flex hook is mainnet-only today. It was deployed at 25933487, well
      # after the chain start_block; no per-contract start_block because
      # HyperSync filters by address server-side (the empty range is free) and
      # because the test harness rejects a contract start_block that differs
      # from the chain's when it simulates events.
      - name: NFTXFlexHook
        address:
          - 0xC26A5Cb51b1818F62a4C6693a9a1feDB3340efc4
  # Ethereum Sepolia. The protocol deployment spans blocks 11465794-11465822.
  - id: 11155111
    start_block: 11465794
    contracts:
      - name: NFTXLocker
        address:
          - 0xb4C5b5235b98114E9DC227b54e088C11680b2385
      - name: NFTXV4Hook
        address:
          - 0xaa49ADaDD33c5E953b645567AFb10CBbba63afC4
  # Robinhood Chain — Arbitrum Nitro (Orbit), native currency ETH. The deployment
  # spans blocks 35354594-35354959; pinned 100 below the first receipt because
  # HyperSync filters by address server-side, so an over-wide range is nearly free.
  - id: 4663
    start_block: 35354494
    contracts:
      - name: NFTXLocker
        address:
          - 0xb4C5b5235b98114E9DC227b54e088C11680b2385
      - name: NFTXV4Hook
        address:
          - 0xaa49ADaDD33c5E953b645567AFb10CBbba63afC4
  # Ink — OP-stack L2 (Kraken). No v4 Ink subgraph exists on The Graph, so this is
  # the only pool-data source for the chain. Deployment spans 54329001-54329039;
  # PoolManager landed at 4580556, ~50M blocks earlier.
  - id: 57073
    start_block: 54328901
    contracts:
      - name: NFTXLocker
        address:
          - 0xb4C5b5235b98114E9DC227b54e088C11680b2385
      - name: NFTXV4Hook
        address:
          - 0xaa49ADaDD33c5E953b645567AFb10CBbba63afC4
  # Arc (5042) — Circle's USDC-native L1. Uniswap's own deployment predates NFTX
  # here too; the NFTX core landed across 21129174-21129248.
  #
  # Two things differ from every other chain in this file:
  #
  #  1. HyperSync does NOT serve Arc mainnet (it serves arc-testnet 5042002
  #     only), so this chain syncs over plain RPC. ENVIO_RPC_URL_5042 must point
  #     at an endpoint that can take it: Arc produces a block every ~0.5s
  #     (~170k/day) and the public node will rate-limit under sustained sync.
  #     The sync only asks for logs from the two NFTX addresses below, and the
  #     receipt effect (src/utils/transactionReceipt.ts) is what reads the
  #     PoolManager activity behind them — one eth_getTransactionReceipt per
  #     NFTX transaction, never one per foreign swap. The paging settings below
  #     bound log batches and retain the fallback.
  #  2. The pool "native" side is 6-decimal USDC (the ERC20 predeploy at
  #     0x3600…0000), not an 18-decimal ETH wrapper, so every *Token0/1 amount
  #     is denominated in USDC. The NFTX indexer carries the matching 1e12 lift
  #     for its own ETH-wei fields (Flayer/Subgraph src/lib/currency.ts
  #     NATIVE_SCALE); nothing here needs it, because these are raw token
  #     amounts and Token.decimals already says 6.
  - id: 5042
    start_block: 21129174
    rpc:
      - url: ${ENVIO_RPC_URL_5042:-https://rpc.mainnet.arc.io}
        for: sync
        initial_block_interval: 1000
        interval_ceiling: 2000
        acceleration_additive: 500
        backoff_multiplicative: 0.5
        backoff_millis: 2000
        query_timeout_millis: 20000
      - url: ${ENVIO_ARC_RPC_URL:-https://rpc.mainnet.arc.io}
        for: fallback
    contracts:
      - name: NFTXLocker
        address:
          - 0xb4C5b5235b98114E9DC227b54e088C11680b2385
      - name: NFTXV4Hook
        address:
          - 0xaa49ADaDD33c5E953b645567AFb10CBbba63afC4
  # Arbitrum One — Nitro, native currency ETH. Deployment spans
  # 498892378-498892454; PoolManager landed at 297842872, ~200M blocks earlier.
  - id: 42161
    start_block: 498892278
    contracts:
      - name: NFTXLocker
        address:
          - 0xb4C5b5235b98114E9DC227b54e088C11680b2385
      - name: NFTXV4Hook
        address:
          - 0xaa49ADaDD33c5E953b645567AFb10CBbba63afC4
